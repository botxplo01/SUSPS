stages:
  ingest:
    cmd: python -m src.pipeline.ingest
    deps:
      - src/pipeline/ingest.py
    outs:
      - data/<CITY>/raw/worldpop_summary.csv
      - data/<CITY>/raw/energy_demand.csv
      - data/<CITY>/raw/traffic_flows.csv
      - data/<CITY>/raw/environment_monthly.csv
      - data/<CITY>/raw/socioeconomic.csv

  preprocess:
    cmd: python -m src.pipeline.preprocess
    deps:
      - src/pipeline/preprocess.py
      - data/<CITY>/raw/worldpop_summary.csv
      - data/<CITY>/raw/energy_demand.csv
      - data/<CITY>/raw/traffic_flows.csv
      - data/<CITY>/raw/environment_monthly.csv
      - data/<CITY>/raw/socioeconomic.csv
    outs:
      - data/<CITY>/processed/worldpop_features.csv
      - data/<CITY>/processed/energy_features.csv
      - data/<CITY>/processed/traffic_features.csv
      - data/<CITY>/processed/environment_features.csv
      - data/<CITY>/processed/socioeconomic_features.csv

  synthetic:
    cmd: python -m src.pipeline.synthetic
    deps:
      - src/pipeline/synthetic.py
    outs:
      - data/<CITY>/processed/synthetic_demographics.csv

  audits:
    cmd: python -m src.pipeline.fairness
    deps:
      - src/pipeline/fairness.py
      - data/<CITY>/processed/synthetic_demographics.csv
    outs:
      - data/<CITY>/processed/fairness_report.csv