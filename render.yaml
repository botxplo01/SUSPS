services:
  - type: web
    name: susps-web
    env: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r backend/requirements.txt
    startCommand: >-
      bash -lc "cd backend && alembic upgrade head && cd .. &&
      if [ \"${DB_BOOTSTRAP_ON_START:-0}\" = \"1\" ]; then python -m backend.app.etl.bootstrap_db; fi &&
      gunicorn src.backend.api:app -k uvicorn.workers.UvicornWorker --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_DB
        value: "1"
