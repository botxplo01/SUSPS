name: Reconcile verified label from Project field

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  issues: write

env:
  PROJECT_ID: PVT_kwHODEf8Cs4BHlR4
  VERIFICATION_FIELD_ID: PVTSSF_lAHODEf8Cs4BHlR4zg4TAgo
  OPTION_VERIFIED_ID: 87ab9463
  OPTION_UNVERIFIED_ID: 3e93c611

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Sync labels to match Project Verification field
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const verificationFieldId = process.env.VERIFICATION_FIELD_ID;
            const optVerified = process.env.OPTION_VERIFIED_ID;
            const optUnverified = process.env.OPTION_UNVERIFIED_ID;

            async function* iterItems() {
              let hasNextPage = true;
              let cursor = null;
              while (hasNextPage) {
                const query = `
                  query($projectId:ID!, $after:String) {
                    node(id:$projectId) {
                      ... on ProjectV2 {
                        items(first: 50, after: $after) {
                          nodes {
                            id
                            content { __typename ... on Issue { id number labels(first:100){nodes{name}} repository { name owner { login } } } }
                            fieldValues(first: 20) {
                              nodes {
                                __typename
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  field { id name }
                                  optionId
                                }
                              }
                            }
                          }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                `;
                const res = await github.graphql(query, { projectId, after: cursor });
                const items = res.node.items.nodes;
                for (const it of items) yield it;
                hasNextPage = res.node.items.pageInfo.hasNextPage;
                cursor = res.node.items.pageInfo.endCursor;
              }
            }

            for await (const item of iterItems()) {
              if (!item.content || item.content.__typename !== 'Issue') { continue; }
              const issue = item.content;
              const owner = issue.repository.owner.login;
              const repo = issue.repository.name;
              const number = issue.number;

              const fv = item.fieldValues.nodes.find(n => n.__typename === 'ProjectV2ItemFieldSingleSelectValue' && n.field && n.field.id === verificationFieldId);
              if (!fv) { core.info(`No Verification field on item ${item.id}; skipping`); continue; }
              const shouldHave = fv.optionId === optVerified;

              const labels = new Set((issue.labels?.nodes || []).map(l => l.name));
              const has = labels.has('verified');

              if (shouldHave && !has) {
                core.info(`Adding verified to #${number} (${owner}/${repo})`);
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['verified'] });
              }
              if (!shouldHave && has) {
                core.info(`Removing verified from #${number} (${owner}/${repo})`);
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'verified' });
                } catch (e) {
                  core.warning(`Remove label failed for #${number}: ${e.message}`);
                }
              }
            }
