name: Issue guard - require verified label before close

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  enforce:
    if: "!contains(toJson(github.event.issue.labels), '\"name\":\"verified\"')"
    runs-on: ubuntu-latest
    steps:
      - name: Reopen and comment when not verified
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: 'Closing blocked: add the `verified` label and ensure acceptance criteria are met (see system_status.md).'
            });
            await github.rest.issues.update({ owner, repo, issue_number: number, state: 'open' });
